# ============================================================ FRUIT MERGE
# ONE-TIME keystore generator.
#
# You need a signing keystore to publish on Play, but making one normally needs
# Java on your computer. This creates it in the cloud instead — no local install.
#
# ⚠️ RUN THIS ONLY ONCE. Download the artifacts and keep the keystore FOREVER.
#    If you lose it you can never update the app. If you run it again you get a
#    DIFFERENT key, which Play will reject for updates.
#
# How to use:
#   1. GitHub → Actions → "Generate signing keystore (run ONCE)" → Run workflow.
#   2. When green, open the run → Artifacts → download "keystore".
#   3. Unzip. Store fruitmerge-release.keystore somewhere safe (password manager
#      + cloud backup). Open SECRETS.txt — those are the 4 values to paste into
#      your repo's Settings → Secrets and variables → Actions.
#   4. Delete the artifact from GitHub afterwards (it contains your key).
name: Generate signing keystore (run ONCE)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (leave default unless you know why)'
        required: false
        default: 'fruitmerge'

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          ALIAS="${{ github.event.inputs.alias || 'fruitmerge' }}"
          PASS="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
          keytool -genkeypair -v \
            -keystore fruitmerge-release.keystore \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Fruit Merge, OU=Mobile, O=Sukoon Studio, L=Karachi, S=Sindh, C=PK"
          B64="$(base64 -w0 fruitmerge-release.keystore)"
          {
            echo "# Fruit Merge — Android signing secrets"
            echo "# Add each line's value in GitHub → Settings → Secrets and variables → Actions."
            echo "# KEEP THIS FILE PRIVATE. Back up the .keystore file forever."
            echo
            echo "KEY_ALIAS=$ALIAS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo
            echo "# KEYSTORE_BASE64 is one long line — copy ALL of it:"
            echo "KEYSTORE_BASE64=$B64"
          } > SECRETS.txt
          echo "Keystore + SECRETS.txt created."

      - name: Upload keystore + secrets
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            fruitmerge-release.keystore
            SECRETS.txt
          retention-days: 7
