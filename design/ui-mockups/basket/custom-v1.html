<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
@font-face{font-family:"Cherry Bomb One";src:url("../../../www/assets/fonts/cherry-bomb-one.woff2") format("woff2")}
body{font-family:"Trebuchet MS",sans-serif;display:flex;justify-content:center}
.phone{width:460px;height:800px;position:relative;overflow:hidden;
 background:radial-gradient(120% 90% at 50% 0%,#fdf0d2,#f6ddae)}
.top{position:absolute;top:14px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start}
.icobtn{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#fffaf0,#ffe9c4);
 border:3px solid #b57e3e;display:flex;align-items:center;justify-content:center;
 box-shadow:0 3px 0 rgba(122,72,20,.5),inset 0 0 0 2px #fff}
.icobtn svg{width:31px;height:31px}
.scorecard{flex:1;background:linear-gradient(180deg,#c98d54,#b5763f);border-radius:16px;text-align:center;
 padding:7px 2px 6px;box-shadow:0 3px 0 rgba(122,72,20,.5);position:relative;border:2px solid #96622a}
.scorecard::before,.scorecard::after{content:"";position:absolute;top:5px;width:6px;height:6px;border-radius:50%;
 background:radial-gradient(circle at 35% 35%,#ffe9b0,#a5712f)}
.scorecard::before{left:7px}.scorecard::after{right:7px}
.scorecard .lab{font-size:10px;font-weight:900;letter-spacing:1.2px;color:#ffe9c4}
.scorecard .val{font-family:"Cherry Bomb One";font-size:24px;color:#fff;line-height:1.05;text-shadow:0 2px 0 rgba(90,50,10,.45)}
.powers{position:absolute;top:98px;left:12px;right:12px;display:flex;gap:7px;align-items:center}
.pw{width:54px;height:54px;border-radius:16px;background:linear-gradient(180deg,#fffaf0,#ffe9c4);
 border:3px solid #b57e3e;display:flex;align-items:center;justify-content:center;position:relative;
 box-shadow:0 3px 0 rgba(122,72,20,.5)}
.pw svg{width:33px;height:33px}
.pw .bdg{position:absolute;top:-8px;right:-8px;background:#e8506a;color:#fff;font-size:11px;font-weight:900;
 min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.nextpill{margin-left:auto;background:linear-gradient(180deg,#fffaf0,#ffe9c4);border:3px solid #b57e3e;
 border-radius:999px;display:flex;align-items:center;gap:4px;padding:7px 11px;position:relative;
 box-shadow:0 3px 0 rgba(122,72,20,.5)}
.nextpill::before{content:"";position:absolute;inset:3px;border:2px dashed rgba(181,126,62,.55);border-radius:999px;pointer-events:none}
.nextpill .lab{font-size:11px;font-weight:900;color:#a5712f;letter-spacing:.5px}
.nextpill img{width:26px;z-index:1}
.board{position:absolute;top:170px;left:14px;right:14px;height:452px;border-radius:22px;
 background:linear-gradient(180deg,#c98d54,#a96f35);border:3px solid #8a5a24;
 box-shadow:0 6px 0 rgba(122,72,20,.35),inset 0 2px 3px rgba(255,240,210,.5)}
.board .inner{position:absolute;inset:15px 15px 17px;border-radius:14px;overflow:hidden;
 background:repeating-linear-gradient(90deg,#f4d8ab 0 62px,#eccf9c 62px 65px);
 box-shadow:inset 0 4px 14px rgba(122,72,20,.35),inset 0 -8px 18px rgba(122,72,20,.18)}
.board .inner::before{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(165,110,50,.4);border-radius:10px;z-index:1;pointer-events:none}
.board .inner::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(160,110,50,.05) 0 3px,transparent 3px 26px)}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;z-index:5;
 background:radial-gradient(circle at 35% 35%,#ffe9b0,#96622a);box-shadow:inset 0 -1px 2px rgba(0,0,0,.4)}
.screw::after{content:"";position:absolute;left:1.5px;right:1.5px;top:4.5px;height:2px;background:rgba(90,50,10,.65);transform:rotate(38deg)}
.danger{position:absolute;left:20px;right:20px;top:52px;border-top:4px dashed #e8506a;opacity:.8;z-index:2}
.guide{position:absolute;left:50%;top:8px;bottom:12px;border-left:3px dotted rgba(165,110,50,.55);z-index:1}
.fr{position:absolute;z-index:2}
.strip{position:absolute;left:14px;right:14px;bottom:54px;height:66px;border-radius:999px;
 background:linear-gradient(180deg,#c98d54,#b5763f);border:3px solid #8a5a24;
 display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;
 box-shadow:0 4px 0 rgba(122,72,20,.4)}
.strip::before{content:"";position:absolute;inset:4px;border:2px dashed rgba(255,233,196,.65);border-radius:999px;pointer-events:none}
.slot{display:flex;align-items:center;justify-content:center;width:38px;height:54px;position:relative;z-index:1}
.slot.ring::before{content:"";position:absolute;width:45px;height:45px;border:3.5px solid #ffdf5e;border-radius:50%;
 box-shadow:0 0 0 2px rgba(232,80,106,.85),0 0 10px rgba(255,217,61,.8)}
.tag{position:absolute;left:14px;bottom:15px;font-family:"Cherry Bomb One";font-size:19px;color:#7a4a21}
.legend{position:absolute;right:14px;bottom:19px;font-size:11px;font-weight:800;color:#a5712f}
</style></head>
