<style>
  /* ============================================================ FRUIT MERGE
     Candy-arcade UI. Chunky, high-contrast, readable for kids, and every
     element that can change size reserves its own space -- the old home
     screen shifted because the PLAY button animated `scale` inside a flex
     column and the achievement list was dumped into a one-line <p>.
     ============================================================ */
  :root{
    --ink:#3a2233; --ink2:#6b4a63;
    --cream:#fff6e8; --cream2:#ffeed6;
    --pink:#ff4d8d; --pink-d:#c4185c;
    --tang:#ff9d2e; --tang-d:#d96b00;
    --yel:#ffd93d; --yel-d:#e0a800;
    --mint:#2fd6a5; --mint-d:#0f9c74;
    --sky:#4cc9ff;  --sky-d:#1a8fd0;
    --grape:#5b2a86;
    --wall:#c96f4a;
    --r-s:14px; --r-m:20px; --r-l:28px;
    /* one step up from the old sizes: the audience includes small kids */
    --fs-tiny:13px; --fs-sm:15px; --fs-md:18px; --fs-lg:24px; --fs-xl:34px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"Trebuchet MS","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink); user-select:none;-webkit-user-select:none; touch-action:none;
    background:#2a1240;
  }
  /* animated candy backdrop: cheap (one composited layer), no layout work */
  body::before{
    content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
    background:
      radial-gradient(38% 32% at 18% 22%, rgba(255,77,141,.55), transparent 70%),
      radial-gradient(34% 30% at 84% 16%, rgba(76,201,255,.50), transparent 70%),
      radial-gradient(42% 36% at 72% 82%, rgba(255,157,46,.45), transparent 70%),
      radial-gradient(40% 34% at 22% 88%, rgba(47,214,165,.42), transparent 70%),
      linear-gradient(160deg,#5b2a86 0%,#3d1a5e 45%,#2a1240 100%);
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1.02)}to{transform:translate3d(2%,2%,0) scale(1.08)}}

  #app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}

  /* ------------------------------------------------------------ top bar --- */
  header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 8px}
  .scoreBox{
    flex:1;background:linear-gradient(180deg,var(--cream),var(--cream2));
    border:3px solid #fff;border-radius:var(--r-m);padding:7px 14px 8px;text-align:center;
    box-shadow:0 5px 0 rgba(58,34,51,.28),0 10px 22px rgba(0,0,0,.28)}
  .scoreBox span{display:block;font-size:var(--fs-tiny);letter-spacing:1.6px;color:var(--ink2);font-weight:800}
  .scoreBox b{font-size:var(--fs-xl);line-height:1.05;color:var(--pink);font-weight:900}
  .scoreBox.best b{color:var(--tang)}
  .scoreBox.best{position:relative}
  .scoreBox.best::before{content:"♛";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:19px;color:var(--yel);text-shadow:0 2px 4px rgba(0,0,0,.35)}
  .scoreBox.goldRush{border-color:var(--yel);box-shadow:0 5px 0 rgba(224,168,0,.6),0 0 26px rgba(255,217,61,.75)}

  .rbtn{
    width:54px;height:54px;border-radius:50%;border:3px solid #fff;
    background:linear-gradient(180deg,var(--cream),var(--cream2));color:var(--pink);
    font-size:24px;box-shadow:0 5px 0 rgba(58,34,51,.28);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
  .rbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(58,34,51,.28)}

  /* ----------------------------------------------------------- toolbar --- */
  #toolbar{display:flex;align-items:center;gap:10px;padding:0 14px 8px}
  .pbtn{position:relative;width:52px;height:52px;border-radius:50%;border:3px solid #fff;color:#fff;font-size:23px;
    background:linear-gradient(160deg,#ff7ab0,var(--pink));box-shadow:0 5px 0 var(--pink-d);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s,opacity .2s}
  .pbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-d)}
  .pbtn.ice{background:linear-gradient(160deg,#8fd4f0,var(--sky));box-shadow:0 5px 0 var(--sky-d)}
  .pbtn:disabled{opacity:.45}
  .pb{position:absolute;top:-6px;right:-6px;background:var(--yel);color:#5b3a00;border:2px solid #fff;
    border-radius:999px;font-size:12px;font-weight:900;padding:1px 6px;line-height:1.35}

  /* NEXT queue: three upcoming fruits, fixed footprint so it never reflows */
  #nextWrap{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:var(--fs-tiny);font-weight:900;
    letter-spacing:1.2px;color:#fff;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55);
    border-radius:999px;padding:5px 14px 5px 16px;backdrop-filter:blur(6px)}
  #nextCv{width:104px;height:38px;display:block}

  #gameCanvas{flex:1;display:block;touch-action:none}

  /* --------------------------------------------------- rotate overlay --- */
  #rotateOv{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(24,10,38,.95);color:#fff5e1;text-align:center;padding:28px}
  #rotateOv.hide{display:none}
  #rotateOv .rotIn{font-size:var(--fs-lg);line-height:1.45;font-weight:800}
  #rotateOv .rotIco{font-size:64px;margin-bottom:14px;animation:rotWob 1.6s ease-in-out infinite}
  #rotateOv .rotSub{font-size:var(--fs-md);opacity:.8;margin-top:10px;font-weight:600}
  @keyframes rotWob{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}

  /* --------------------------------------------------------- overlays --- */
  .ov{position:fixed;inset:0;background:rgba(24,10,38,.62);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;z-index:20;padding:18px;overflow-y:auto;
    overflow-x:hidden}
  .ov.hide{display:none}
  .card{
    background:linear-gradient(180deg,var(--cream),var(--cream2));
    border-radius:var(--r-l);padding:26px 22px;max-width:380px;width:100%;text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.45);border:4px solid #fff;
    animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .card h1{margin:0 0 6px;font-size:var(--fs-xl);color:var(--pink);font-weight:900}
  .card h2{margin:0 0 10px;font-size:28px;color:var(--ink);font-weight:900}
  .card p{margin:8px 0;font-size:var(--fs-md);color:var(--ink2);line-height:1.5;font-weight:600}
  .card .big{font-size:56px;margin:4px 0;line-height:1}
  .card .sc{font-size:44px;color:var(--pink);font-weight:900;margin:2px 0}
  .card .bs{font-size:var(--fs-md);color:var(--tang);font-weight:800}

  .btn{display:block;width:100%;margin-top:12px;border:0;border-radius:var(--r-m);padding:16px;
    font-size:var(--fs-md);font-weight:900;cursor:pointer;letter-spacing:.3px;
    transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(3px);box-shadow:none!important}
  .btn.main{background:linear-gradient(135deg,var(--pink),var(--tang));color:#fff;box-shadow:0 6px 0 var(--pink-d)}
  .btn.sub{background:#ffe6c2;color:var(--ink);box-shadow:0 5px 0 #e2bd8e}
  .btn.gold{background:linear-gradient(135deg,var(--yel),var(--tang));color:#5b3a00;box-shadow:0 6px 0 var(--yel-d)}
  .badge{display:inline-block;background:linear-gradient(135deg,var(--yel),var(--tang));color:#5b3a00;
    border-radius:999px;padding:6px 18px;font-size:var(--fs-sm);font-weight:900;margin-bottom:8px;letter-spacing:.6px;
    box-shadow:0 4px 0 var(--yel-d)}
  .rules{text-align:left;background:var(--cream);border-radius:var(--r-s);padding:12px 16px;margin:12px 0;border:2px solid #ffe6c2}
  .rules li{font-size:var(--fs-sm);color:var(--ink2);margin:6px 0;line-height:1.45;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:12px 0 2px}
  .chip2{border:3px solid #fff;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;
    padding:10px 16px;font-size:var(--fs-sm);font-weight:900;cursor:pointer;
    box-shadow:0 4px 0 rgba(58,34,51,.25);transition:transform .08s,box-shadow .08s}
  .chip2:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(58,34,51,.25)}
  .chip2.on{background:linear-gradient(135deg,var(--mint),#5ff0c4);color:#084433;border-color:#fff}

  /* ============================================================ HOME ===== */
  .ov.home{background:transparent;backdrop-filter:none;pointer-events:none;padding:0;overflow:hidden}
  .ov.home .rbtn,.ov.home .playBig,.ov.home .chip2,.ov.home .hstat,
  .ov.home .langBtn,.ov.home .achTile{pointer-events:auto}

  .homeTop{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .langBtn{display:flex;align-items:center;gap:7px;border:3px solid #fff;border-radius:999px;
    background:rgba(255,255,255,.18);color:#fff;font-size:var(--fs-sm);font-weight:900;
    padding:9px 16px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .langBtn:active{transform:translateY(3px);box-shadow:none}

  /* Title: bubbly gradient letters. Transform-only animation on a block that
     owns its own space, so nothing around it can shift. */
  .homeTitle{position:absolute;top:5%;left:0;right:0;text-align:center;pointer-events:none;
    padding:0 12px;will-change:transform}
  .homeTitle h1{
    margin:0;font-size:clamp(46px,13vw,76px);font-weight:900;letter-spacing:2px;line-height:1;
    background:linear-gradient(180deg,#fff 0%,var(--yel) 42%,var(--tang) 70%,var(--pink) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(58,34,51,.55)) drop-shadow(0 10px 26px rgba(0,0,0,.45));
    animation:titleBob 3.4s ease-in-out infinite}
  .homeTitle p{margin:10px 0 0;font-size:var(--fs-md);font-weight:800;color:#fff;
    text-shadow:0 2px 0 rgba(58,34,51,.5),0 6px 18px rgba(0,0,0,.4)}
  @keyframes titleBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}

  /* Bottom dock. `contain:layout style` + a fixed-height message line means the
     block below can never push the buttons around. */
  .homeBottom{position:absolute;bottom:calc(3% + env(safe-area-inset-bottom));left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 18px;
    contain:layout style}
  .homeStats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .hstat{background:rgba(255,255,255,.94);border:3px solid #fff;border-radius:999px;padding:9px 16px;
    font-size:var(--fs-sm);font-weight:900;color:var(--ink);cursor:pointer;
    box-shadow:0 4px 0 rgba(58,34,51,.28);display:flex;align-items:center;gap:6px}
  .hstat:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(58,34,51,.28)}
  .hstat b{color:var(--pink);font-size:var(--fs-md)}

  /* PLAY: the pulse is a box-shadow glow, not a scale. A scaled child inside a
     flex column makes its siblings move on every frame -- that was the
     "breathing" bottom bar. */
  .playBig{width:min(84vw,340px);padding:20px;border:0;border-radius:999px;
    font-size:28px;font-weight:900;letter-spacing:1.5px;color:#fff;
    background:linear-gradient(135deg,var(--pink) 0%,var(--tang) 100%);
    box-shadow:0 8px 0 var(--pink-d),0 18px 40px rgba(255,77,141,.5);cursor:pointer;
    text-shadow:0 2px 0 rgba(0,0,0,.22);
    animation:glowBtn 2.1s ease-in-out infinite;will-change:box-shadow}
  .playBig:active{transform:translateY(4px);box-shadow:0 3px 0 var(--pink-d);animation:none}
  @keyframes glowBtn{
    0%,100%{box-shadow:0 8px 0 var(--pink-d),0 18px 40px rgba(255,77,141,.45)}
    50%    {box-shadow:0 8px 0 var(--pink-d),0 18px 58px rgba(255,217,61,.75)}
  }

  /* fixed footprint: 2 lines reserved, so text appearing or wrapping cannot
     move the dock */
  #homeMsg{font-size:var(--fs-sm);font-weight:800;color:#fff;text-align:center;margin:0;
    height:44px;line-height:1.35;overflow:hidden;text-shadow:0 2px 0 rgba(58,34,51,.5);
    display:flex;align-items:center;justify-content:center}
  .homeCredit{font-size:var(--fs-tiny);color:rgba(255,255,255,.55);font-weight:700;margin:0;letter-spacing:.4px}

  /* -------------------------------------------------- achievement panel --- */
  .achHead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .achHead .achMedal{font-size:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
  .achHead h2{margin:0;font-size:26px;font-weight:900;color:var(--ink)}
  .achHead p{margin:2px 0 0;font-size:var(--fs-sm);color:var(--ink2);font-weight:700}
  .achBar{height:14px;border-radius:999px;background:#ffe6c2;overflow:hidden;border:2px solid #fff;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.12);margin:0 0 16px}
  .achBar i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--mint),var(--yel),var(--tang));
    transition:width .45s cubic-bezier(.34,1.56,.64,1)}
  .achGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .achTile{border:3px solid #fff;border-radius:var(--r-m);padding:12px 6px 10px;text-align:center;cursor:default;
    background:linear-gradient(180deg,#fff,var(--cream2));box-shadow:0 4px 0 rgba(58,34,51,.22);
    display:flex;flex-direction:column;align-items:center;gap:6px;min-height:104px;justify-content:center}
  .achTile .achIco{font-size:32px;line-height:1;filter:grayscale(1) opacity(.35)}
  .achTile .achName{font-size:12.5px;font-weight:900;color:var(--ink2);line-height:1.25}
  .achTile.on{background:linear-gradient(180deg,#fff,var(--yel));box-shadow:0 4px 0 var(--yel-d),0 0 18px rgba(255,217,61,.5)}
  .achTile.on .achIco{filter:none;animation:achPop .5s cubic-bezier(.34,1.56,.64,1)}
  .achTile.on .achName{color:#5b3a00}
  @keyframes achPop{from{transform:scale(.4) rotate(-14deg)}to{transform:scale(1) rotate(0)}}

  .inmenu header,.inmenu #toolbar{display:none}

  /* ------------------------------------------------------- end popup --- */
  .endScores{display:flex;gap:12px;margin:14px 0 6px}
  .endBox{flex:1;background:#fff;border:3px solid #ffe6c2;border-radius:var(--r-m);padding:12px 8px}
  .endBox span{display:block;font-size:11.5px;letter-spacing:1.2px;color:var(--ink2);font-weight:900}
  .endBox b{font-size:var(--fs-xl);color:var(--pink);font-weight:900}
  .endBox.gold{border-color:var(--yel);background:linear-gradient(180deg,#fff,#fff6d8)}
  .endBox.gold b{color:var(--tang)}

  /* ------------------------------------------------------- volume ------- */
  #volOv input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:12px 0}
  #volOv input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:#ffe6c2}
  #volOv input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
    margin-top:-10px;background:linear-gradient(135deg,var(--pink),var(--tang));border:3px solid #fff;
    box-shadow:0 3px 10px rgba(0,0,0,.3)}
  #volOv input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:#ffe6c2}
  #volOv input[type=range]::-moz-range-thumb{width:30px;height:30px;border:3px solid #fff;border-radius:50%;background:var(--pink)}
</style>
